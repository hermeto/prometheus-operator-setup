name: ci

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: 1.16.5
  TFLINT_VERSION: v0.53.0
  HELM_VERSION: v3.22.0
  KUBECONFORM_VERSION: v0.8.0
  TRIVY_VERSION: 0.75.0
  TF_IN_AUTOMATION: "true"

jobs:
  terraform:
    name: terraform (fmt, validate, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('.tflint.hcl') }}
      - run: make fmt-check
      - run: make validate
      - run: make lint
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: make test-unit

  monitoring-as-code:
    name: rules and dashboards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make test-rules
      - run: make test-dashboards

  helm:
    name: chart render (helm template, kubeconform, amtool)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kubeconform
      - run: make test-helm

  scripts:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make test-scripts

  security:
    name: trivy config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install trivy
        run: |
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | sudo tar xz -C /usr/local/bin trivy
      - run: make security
